root = "."
tmp_dir = "bin"

[build]
cmd = "go build -buildvcs=false -o ./bin/main ./cmd/api"
entrypoint = "./bin/main"

args_bin = []

include_ext = ["go", "tpl", "tmpl", "html"]
exclude_dir = ["assets", "tmp", "vendor", "frontend/node_modules", "bin", "docs", ".git"]
include_dir = []
include_file = []
exclude_file = ["docs/docs.go", "docs/swagger.json", "docs/swagger.yaml"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = false
follow_symlink = true

log = "air.log"

poll = true
poll_interval = 1000

delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = 500

rerun = false
rerun_delay = 500

pre_cmd = []

[log]
time = false
main_only = true
silent = false

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
keep_scroll = true
